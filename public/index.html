<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Dice Game</title>

  <link rel="stylesheet" href="./css/styles.css">

  <link href="https://fonts.googleapis.com/css?family=Indie+Flower|Lobster"
        rel="stylesheet">
</head>

<body>

  <div class="top">
    <h1 class="header"><u>Dice Game</u></h1>
  </div>

  <div class="dice">

    <div class="player1">
      <p>
        <u>Player 1</u><br>
        Score: <span id="score1">0</span>
      </p>

      <img class="img1" src="images/dice1.png">
    </div>

    <div class="player2">
      <p>
        <u>Player 2</u><br>
        Score: <span id="score2">0</span>
      </p>

      <img class="img2" src="images/dice6.png">
    </div>

  </div>

  <div class="footer">
    <button class="rollAgain" onclick="rollAgain()">
      Roll Again!
    </button>

    <button class="newGame" onclick="newGame()">
      New Game!
    </button>
  </div>

  <script src="index.js"></script>

</body>
</html>
